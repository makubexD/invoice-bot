# Shape of the runtime configuration (illustrative; validated by pydantic at startup).
# Secrets are NOT here: they come from .env (see names in ALL_CAPS references).

owner:
  ruc: "20XXXXXXXXX"          # your company RUC (flow A buyer)
  timezone: America/Lima
  language: es-PE

work:
  ruc: "20YYYYYYYYY"          # employer RUC (flow B buyer)

senders:                      # allowlist (E.164 without +)
  "51999999999": { name: "Yo", profile: owner }
  "51988888888": { name: "Asistente", profile: limited }

profiles:
  owner:   { flows: [personal_google, work_microsoft], can_send_batch: true }
  limited: { flows: [personal_google], can_send_batch: false }

channel:
  kind: whatsapp_cloud        # whatsapp_cloud | telegram
  phone_number_id: "123456789"
  graph_api_version: v23.0    # verify current version at build time
  # WHATSAPP_TOKEN, WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN in .env

sunat:
  validez_api: { enabled: true }        # SUNAT_CLIENT_ID / SUNAT_CLIENT_SECRET in .env
  sol: { enabled: true }                # SOL_RUC / SOL_USER / SOL_PASSWORD (secondary user) in .env
  padron: { refresh_cron: "0 4 * * 0" } # weekly Sunday 04:00

extraction:
  max_image_px: 2000
  ocr: { engine: tesseract, lang: spa, timeout_s: 30 }
  review_threshold: 0.8
  max_invoice_age_days: 365

# Automatic routing (R-3.1). Ordered; the first match wins. No menu unless nothing matches (BR-R03).
routing:
  confirm_mode: auto            # auto: proceed when every field is ok | always: wait for a confirmation tap
  rules:
    - id: BR-R01
      when: { num_doc_adq: ["{owner.ruc}"] }
      flow: personal_google
    - id: BR-R02
      when: { num_doc_adq: ["{work.ruc}"] }
      flow: work_microsoft
    # Example for later: a second company, or route by issuer
    # - id: BR-R10
    #   when: { num_doc_adq: ["20ZZZZZZZZZ"] }
    #   flow: second_company
  unmatched: ask                # ask (BR-R03) | reject

flows:
  personal_google:
    label: "Mi empresa (Google)"
    fetchers: [qr_url, portal_registry, email_inbox, sunat_sol, manual]
    required_docs: [xml]                # pdf is nice-to-have
    deliver_without_docs: false         # true => deliver now, attach docs later (R-5.9)
    sinks:
      - kind: google_drive
        root_folder_id: "DRIVE_FOLDER_ID"
        path: "{fecha:%Y}/{fecha:%m}"
        filename: "{fecha:%Y-%m-%d}_{ruc_emisor}_{serie}-{numero}"
        upload: [photo, pdf, xml]
      - kind: google_sheets
        spreadsheet_id: "SHEET_ID"
        tab: "Compras"
        upsert_key: natural_key
        columns:                        # header -> expression
          Fecha: "{fecha:%d/%m/%Y}"
          RUC: "{ruc_emisor}"
          "Razón social": "{razon_social}"
          Tipo: "{tipo_desc}"
          "Serie-Número": "{serie}-{numero}"
          Base: "{base}"
          IGV: "{igv}"
          Total: "{total}"
          "Estado SUNAT": "{sunat.estado_cp_desc}"
          Foto: "{refs.google_drive.photo.link}"
          PDF: "{refs.google_drive.pdf.link}"
          XML: "{refs.google_drive.xml.link}"
      # - kind: n8n_hook                 # optional: hand over to an n8n workflow
      #   url: "https://n8n.example/webhook/invoice"

  work_microsoft:
    label: "Trabajo (Microsoft)"
    fetchers: [qr_url, portal_registry, email_inbox, manual]   # no sunat_sol: no access to work RUC
    required_docs: [xml, pdf]
    deliver_without_docs: false
    sinks:
      - kind: onedrive
        account: personal               # MSAL cache name
        path: "/Facturas Trabajo/{fecha:%Y}/{fecha:%m}"
        filename: "{fecha:%Y-%m-%d}_{ruc_emisor}_{serie}-{numero}"
        upload: [photo, pdf, xml]
      - kind: excel_template
        template: "/Plantillas/rendicion.xlsx"   # OneDrive path of your template
        output: "/Facturas Trabajo/{fecha:%Y}/{fecha:%m}/{serie}-{numero}.xlsx"
        sheet: "Hoja1"
        cells:                          # fixed cells you said need updating
          C4: "{fecha:%d/%m/%Y}"
          C5: "{ruc_emisor}"
          C6: "{razon_social}"
          C7: "{serie}-{numero}"
          C8: "{total}"
      - kind: mailer
        provider: graph                 # graph | gmail
        batch_aware: true
        trigger:
          modes: [on_command, scheduled]   # any of: per_invoice | on_command | scheduled
          schedule: "0 18 * * 5"           # Fridays 18:00 Lima
          confirm_before_send: true
          min_items: 1
        to: ["contabilidad@empresa.pe"]
        cc: []
        subject: "Rendición de gastos {batch.from:%d/%m} - {batch.to:%d/%m} ({batch.count} comprobantes)"
        body_template: "templates/email_rendicion.html.j2"
        attach: [pdf, xml, excel_template]
        zip_if_over_mb: 3

retrieval:
  email_inbox:
    provider: gmail                     # gmail | graph
    retry_schedule: ["5m", "1h", "6h", "24h"]
  captcha:
    local_ocr_attempts: 2
    ask_user_timeout_s: 300
    paid_solver: { enabled: false, provider: 2captcha }   # TWOCAPTCHA_KEY
  paid_api: { enabled: false, provider: factiliza }

gaps:                           # R-11 · capability gaps → GitHub + admin
  github:
    enabled: true
    repo: "makubexD/invoice-bot"
    labels: [gap]
    daily_write_budget: 20
    # GITHUB_TOKEN (fine-grained, this repo only) and GITHUB_TOKEN_EXPIRES (YYYY-MM-DD) in .env
  admins: ["51999999999"]       # get the WhatsApp alerts
  teach_via_chat: true          # BR-F02: ask the user for the portal link (once per issuer)
  realert_days: 7
  gap_sla_days: 3               # gap-watch workflow turns red after this
  broken_after: 3               # consecutive technical failures → PORTAL_BROKEN
  digest_kinds: [PARSER_MISS, UNROUTED_BUYER]
  digest_cron: "0 8 * * *"

deploy:
  config_pull: { enabled: true, interval_min: 10, branch: main }   # R-11.9 pull + hot reload

limits:
  max_queued_per_sender: 20
  heavy_concurrency: 1
  browser_idle_close_s: 60
  per_domain_min_interval_s: 10
